[build]
  command = "npm run build"
  publish = "dist"

# Teruskan API ke situs backend. Status 200 = proxy, jadi browser tetap melihat satu domain (tanpa CORS).
[[redirects]]
  from = "/api/*"
  to = "https://be-absensi.netlify.app/api/:splat"
  status = 200
  force = true

# Semua route React (/riwayat, /admin/...) dilayani oleh index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
