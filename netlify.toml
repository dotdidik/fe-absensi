[build]
  command = "npm run build"
  publish = "dist"

# Teruskan API ke situs backend. Status 200 = proxy, jadi browser tetap melihat satu domain (tanpa CORS).
# GANTI alamat di bawah dengan URL situs backend di Netlify.
[[redirects]]
  from = "/api/*"
  to = "https://GANTI-URL-BACKEND.netlify.app/api/:splat"
  status = 200
  force = true

# Semua route React (/riwayat, /admin/...) dilayani oleh index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
